name: bootstrap

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Enforce the Cat Food ai-ci contract
        uses: isomorphisms/ai-ci@e342fc1e58bde3e7bcb82875b66f721725a600e8
        with:
          suite: ci/aici.suite.tsv
          root: .
      - name: Check stage-zero syntax
        shell: sh
        run: |
          dash -n bootstrap.sh
          dash -n update-tools.ysh
          dash -n catfood
          dash -n tests/entrypoint.sh
      - name: Exercise cloud and Termux entrypoints
        shell: sh
        run: sh tests/entrypoint.sh
      - name: Feed toolchain with POSIX sh
        shell: sh
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
          CATFOOD_DEPTH: 1
        run: sh ./bootstrap.sh
      - name: Exercise stable price commands and az search
        shell: bash
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
          CATFOOD_DEPTH: 1
        run: |
          set -euo pipefail
          test -x "$CATFOOD_ROOT/bin/az"
          test -x "$CATFOOD_ROOT/bin/abe"

          export PATH="$CATFOOD_ROOT/bin:$PATH"
          abe help >/dev/null

          fake_bin="$RUNNER_TEMP/catfood-fake-bin"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/curl" <<'EOF'
          #!/bin/sh
          for arg in "$@"; do
            case "$arg" in
              https://mock/token)
                printf '%s\n' '{"access_token":"test-token","expires_in":3600}'
                exit 0
                ;;
              https://mock/catalog/v1/searchItems)
                cat <<'JSON'
          {"searchResult":{"items":[{"asin":"B098765432","detailPageURL":"https://www.amazon.com/dp/B098765432?tag=macguyver03-20&linkCode=osi","itemInfo":{"title":{"displayValue":"A Small Useful Book"}},"offersV2":{"listings":[{"isBuyBoxWinner":true,"price":{"money":{"amount":12.34,"currency":"USD"}}}]}}]}}
          JSON
                exit 0
                ;;
            esac
          done
          printf 'fake curl: unexpected arguments: %s\n' "$*" >&2
          exit 22
          EOF
          chmod +x "$fake_bin/curl"

          export PATH="$fake_bin:$PATH"
          export AZ_AMAZON_CREDENTIAL_ID=test-id
          export AZ_AMAZON_CREDENTIAL_SECRET=test-secret
          export AZ_AMAZON_CREDENTIAL_VERSION=3.1
          export AZ_AMAZON_TOKEN_ENDPOINT=https://mock/token
          export AZ_CREATORS_API_BASE=https://mock

          output=$(az search small useful book)
          printf '%s\n' "$output"
          grep -F $'B098765432\t12.34\tUSD' <<<"$output"
          grep -F 'A Small Useful Book' <<<"$output"
