name: bootstrap

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce the Cat Food ai-ci contract
        uses: isomorphisms/ai-ci@e342fc1e58bde3e7bcb82875b66f721725a600e8
        with:
          suite: ci/aici.suite.tsv
          root: .
      - name: Check stage-zero syntax
        shell: sh
        run: |
          dash -n bootstrap.sh
          dash -n update-tools.ysh
          dash -n catfood
          dash -n provision.sh
          dash -n install-binaries.sh
          dash -n android/check.sh
          dash -n android/install.sh
          dash -n tests/android-delivery.sh
          dash -n tests/runtime-binaries.sh
          dash -n tests/entrypoint.sh
          dash -n ci/repositories.sh
          dash -n tests/repository-identities.sh
      - name: Verify transferred repository identity and updates
        shell: sh
        run: sh tests/repository-identities.sh
      - name: Exercise Android delivery contracts
        shell: sh
        run: sh tests/android-delivery.sh
      - name: Exercise pinned runtime binary contracts
        shell: sh
        run: sh tests/runtime-binaries.sh
      - name: Exercise cloud and generic Termux entrypoints
        shell: sh
        run: sh tests/entrypoint.sh
      - name: Feed toolchain with POSIX sh
        shell: sh
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
          CATFOOD_DEPTH: 1
        run: sh ./bootstrap.sh
      - name: Verify stable command launchers are installed
        shell: sh
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
        run: |
          # Bootstrap fetches sources; runtime behavior requires provisioning.
          test -x "$CATFOOD_ROOT/bin/az"
          test -x "$CATFOOD_ROOT/bin/abe"
