name: ai-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catfood-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 237b3be5e10d15c51b9862b548c5c845e37f239d
          path: _ai-ci
          persist-credentials: false
      - name: Verify Catfood linkage contracts
        shell: sh
        run: |
          cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 \
            -o "$RUNNER_TEMP/aici" _ai-ci/src/aici.c
          "$RUNNER_TEMP/aici" verify \
            _ai-ci/contracts/catfood-idric-cli-v0.contract.tsv .
          "$RUNNER_TEMP/aici" verify \
            _ai-ci/contracts/catfood-issh-v0.contract.tsv .

      - name: Verify Android producer receipt handoff
        shell: sh
        run: sh tests/android-producer.sh
