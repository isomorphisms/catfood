name: Termux bootstrap structural test

on:
  push:
    paths:
      - 'termux-bootstrap.sh'
      - 'termux-setup.grease'
      - 'TERMUX.md'
      - 'tests/check-termux-bootstrap.sh'
      - '.github/workflows/termux-bootstrap.yml'
  pull_request:
    paths:
      - 'termux-bootstrap.sh'
      - 'termux-setup.grease'
      - 'TERMUX.md'
      - 'tests/check-termux-bootstrap.sh'
      - '.github/workflows/termux-bootstrap.yml'

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check stage-zero shape and secret exclusion
        run: sh tests/check-termux-bootstrap.sh
