name: SDF host and target boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check out the accepted mandatory Ithon host frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 9d530f4ad51f5b0a09c3e74dbe45cac5bb6d52d3
          path: .ithon
          persist-credentials: false
      - name: Execute all four checked SDF host fixture groups
        run: ./.ithon/ithon tests/sdf_mailbox.pi
