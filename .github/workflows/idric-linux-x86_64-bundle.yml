name: Pinned Idriç Linux x86_64 bundle and fresh-host Intervals

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/idric-linux-x86_64-bundle.yml'
      - 'ci/idric-linux-x86_64-package.sh'
      - 'ci/idric-linux-x86_64-env.sh'
      - 'docs/idric-linux-x86_64-bundle.md'
  pull_request:
    paths:
      - '.github/workflows/idric-linux-x86_64-bundle.yml'
      - 'ci/idric-linux-x86_64-package.sh'
      - 'ci/idric-linux-x86_64-env.sh'
      - 'docs/idric-linux-x86_64-bundle.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idric-linux-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IDRIC_SHA: 94dfd99bd3e376507fedc8611053b7173b2519f0
  INTERVALS_SHA: 5590933a1c6668643e8911dfb1260b0ce8c2ee00
  BUNDLE_NAME: idric-linux-x86_64-94dfd99bd3e376507fedc8611053b7173b2519f0

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out packaging code at exact proposed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch only the pinned Idriç compiler source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 94dfd99bd3e376507fedc8611053b7173b2519f0
          path: idric-source
          persist-credentials: false
      - name: Check producer platform and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(git -C idric-source rev-parse HEAD)" = "$IDRIC_SHA"
          sh -n ci/idric-linux-x86_64-package.sh ci/idric-linux-x86_64-env.sh
      - name: Restore exact pinned compiler producer cache
        id: producer-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            idric-source/_/.tools
            idric-source/_/bootstrap-build
            idric-source/_/build
            idric-source/_/libs/*/build
            idric-source/_/support/c
          key: earth4a-idric-ubuntu24-x86_64-94dfd99bd3e376507fedc8611053b7173b2519f0-v1
      - name: Build the pinned compiler with its owned Chez runtime
        if: steps.producer-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          JOBS: '2'
        run: |
          set -euo pipefail
          sh idric-source/edric bootstrap
          test -x idric-source/_/build/exec/idris2
          idric-source/_/build/exec/idris2 --version
      - name: Save exact pinned compiler producer cache
        if: steps.producer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            idric-source/_/.tools
            idric-source/_/bootstrap-build
            idric-source/_/build
            idric-source/_/libs/*/build
            idric-source/_/support/c
          key: earth4a-idric-ubuntu24-x86_64-94dfd99bd3e376507fedc8611053b7173b2519f0-v1
      - name: Verify pinned compiler identity even when producer cache is restored
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C idric-source rev-parse HEAD)" = "$IDRIC_SHA"
          idric-source/_/build/exec/idris2 --version | tee "$RUNNER_TEMP/idric-build-version.txt"
          grep -F '0.8.0-94dfd99bd' "$RUNNER_TEMP/idric-build-version.txt"
      - name: Package compiler, matching TTC libraries, support and Chez
        shell: bash
        run: |
          set -euo pipefail
          sh ci/idric-linux-x86_64-package.sh idric-source "$RUNNER_TEMP/bundles"
      - name: Retain immutable candidate bundle and hash
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: idric-linux-x86_64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bundles/${{ env.BUNDLE_NAME }}.tar.gz
            ${{ runner.temp }}/bundles/${{ env.BUNDLE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  fresh-host-intervals:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download only the compiled bundle from the producer job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: idric-linux-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/incoming
      - name: Check out exact accepted Intervals consumer source, not Idriç
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/intervals.idr
          ref: 5590933a1c6668643e8911dfb1260b0ce8c2ee00
          path: intervals
          persist-credentials: false
      - name: Install and verify bundle on a separate fresh Linux host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(git -C intervals rev-parse HEAD)" = "$INTERVALS_SHA"
          test ! -e idric-source
          mkdir -p "$RUNNER_TEMP/installed/compiler-tools" "$RUNNER_TEMP/fresh-home"
          cd "$RUNNER_TEMP/incoming"
          sha256sum --check "$BUNDLE_NAME.tar.gz.sha256"
          tar -tzf "$BUNDLE_NAME.tar.gz" | awk -v name="$BUNDLE_NAME" '
            index($0, name "/") != 1 { print "archive path escapes prefix: " $0 > "/dev/stderr"; bad=1 }
            /(^|\/)\.\.(\/|$)/ { print "unsafe archive path: " $0 > "/dev/stderr"; bad=1 }
            END { exit bad }'
          tar -xzf "$BUNDLE_NAME.tar.gz" -C "$RUNNER_TEMP/installed/compiler-tools"
          installed="$RUNNER_TEMP/installed/compiler-tools/$BUNDLE_NAME"
          ( cd "$installed" && sha256sum --check payload.sha256 )
          test ! -e "$installed/.git"
          test ! -e "$installed/compiler/src"
          "$installed/bin/idric" --version | tee "$RUNNER_TEMP/idric-version.txt"
          "$installed/bin/idric-env" sh -c 'test "$(printf "(threaded?)\n" | scheme --quiet | tail -n 1)" = "#t"'
      - name: Compile and execute Intervals core without a compiler checkout or cache
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/fresh-home"
          installed="$RUNNER_TEMP/installed/compiler-tools/$BUNDLE_NAME"
          cd intervals
          "$installed/bin/idric" --build intervals-idric-core.ipkg
          "$installed/bin/idric-env" ./build/exec/interval-idric-core-tests
      - name: Compile and execute Intervals aggregate without a compiler checkout or cache
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/fresh-home"
          installed="$RUNNER_TEMP/installed/compiler-tools/$BUNDLE_NAME"
          cd intervals
          "$installed/bin/idric" --build intervals-idric.ipkg
          "$installed/bin/idric-env" ./build/exec/interval-idric-tests
      - name: Record exact compiler and Intervals acceptance identities
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'schema=catfood-idric-intervals-fresh-host-v1'
            echo "compiler_commit=$IDRIC_SHA"
            echo "intervals_commit=$(git -C intervals rev-parse HEAD)"
            echo 'host_os=linux'
            echo 'host_arch=x86_64'
            echo "bundle_sha256=$(awk '{print $1}' "$RUNNER_TEMP/incoming/$BUNDLE_NAME.tar.gz.sha256")"
            echo 'compiler_source_checkout=absent'
            echo 'compiler_cache_restore=absent'
            echo 'installed_bundle=PASS'
            echo 'intervals_core=PASS'
            echo 'intervals_aggregate=PASS'
          } > "$RUNNER_TEMP/fresh-host-receipt.txt"
          cat "$RUNNER_TEMP/fresh-host-receipt.txt"
      - name: Retain fresh-host evidence separately from the compiler archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: idric-fresh-host-intervals-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/idric-version.txt
            ${{ runner.temp }}/fresh-host-receipt.txt
          if-no-files-found: warn
          retention-days: 14
