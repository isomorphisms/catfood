name: Native Grease handoff checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # The pinned action acquires C++ Grease artifact 12192502970. FP #67
      # explicitly disallows it; a green compatibility run is not admission.
      - name: BLOCKED pending an independently accepted permitted Grease closure
        run: exit 1
      - uses: isomorphisms/ai-ci/transfer-handoff@786937a9cd5499a21bef87f9358226b5e7a62ef8
        with:
          catfood_ref: ${{ github.event.pull_request.head.sha || github.sha }}
          kitchen_ref: 32c3bf2d7c6268b50f1e48395dc972cfbafec7a9
          fp_ref: 146408ab64fe52c62edaa414126cae5ec952b3ca
          aici_ref: 786937a9cd5499a21bef87f9358226b5e7a62ef8
