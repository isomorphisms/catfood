name: tablet-cli-hash

on:
  push:
    branches: [tablet-cli-pkg]

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Hash pinned az commands
        shell: sh
        run: |
          set -eu
          ref=caddedfe01da1bd649b6ba8d4046fcacaa9fe01e
          curl -fsSLo az "https://raw.githubusercontent.com/isomorphisms/az/$ref/bin/az"
          curl -fsSLo abe "https://raw.githubusercontent.com/isomorphisms/az/$ref/bin/abe"
          sha256sum az abe
