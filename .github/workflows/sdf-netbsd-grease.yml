name: SDF NetBSD Grease helpers

on:
  push:
    branches: [sdf/netbsd-grease]
  pull_request:
    paths:
      - catfood
      - provision.sh
      - target.sh
      - TARGETS.md
      - sdf/**
      - vendor/ai-ci/host-context/**
      - tests/targets.sh
      - tests/sdf-netbsd-grease.sh
      - .github/workflows/sdf-netbsd-grease.yml

permissions:
  contents: read

env:
  AICI_HOST_CONTEXT_REVISION: 7062767b79c5778ed907cc9709fdac918fab24cf

jobs:
  helper-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Cat Food revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned AICI host-context source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: ${{ env.AICI_HOST_CONTEXT_REVISION }}
          path: _aici-host-context
          persist-credentials: false
      - name: Prove vendored executor is byte-identical to AICI pin
        shell: sh
        run: cmp vendor/ai-ci/host-context/execute.sh _aici-host-context/host-context/execute.sh
      - name: Check POSIX shell syntax
        shell: sh
        run: sh -n target.sh catfood provision.sh sdf/platform.sh sdf/preflight.sh sdf/fetch-grease.sh sdf/provision.sh sdf/install-grease.sh sdf/benchmark-grep.sh vendor/ai-ci/host-context/execute.sh tests/targets.sh tests/sdf-netbsd-grease.sh
      - name: Exercise target detection
        shell: sh
        run: sh tests/targets.sh
      - name: Exercise SDF mediated preflight, fetch, install, and benchmark harness
        shell: sh
        run: sh tests/sdf-netbsd-grease.sh

  netbsd-9_3-helper-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Cat Food revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned AICI host-context source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: ${{ env.AICI_HOST_CONTEXT_REVISION }}
          path: _aici-host-context
          persist-credentials: false
      - name: Exercise helper contract in NetBSD 9.3
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          release: "9.3"
          arch: x86_64
          run: |
            set -eu
            uname -a
            cd "$GITHUB_WORKSPACE"
            cmp vendor/ai-ci/host-context/execute.sh _aici-host-context/host-context/execute.sh
            sh -n target.sh catfood provision.sh sdf/platform.sh sdf/preflight.sh sdf/fetch-grease.sh sdf/provision.sh sdf/install-grease.sh sdf/benchmark-grep.sh vendor/ai-ci/host-context/execute.sh tests/targets.sh tests/sdf-netbsd-grease.sh
            sh tests/targets.sh
            sh tests/sdf-netbsd-grease.sh

            live_home="$GITHUB_WORKSPACE/_/sdf-live-home"
            rm -rf "$live_home"
            mkdir -p "$live_home"
            HOME="$live_home" CATFOOD_ROOT="$live_home/opt" CATFOOD_TARGET=sdf \
              sh ./catfood
            "$live_home/opt/bin/greasecpp" -c 'echo live-greasecpp-netbsd-9.3' \
              | grep -Fx 'live-greasecpp-netbsd-9.3'
            "$live_home/opt/bin/grease" -c 'echo live-grease-default-netbsd-9.3' \
              | grep -Fx 'live-grease-default-netbsd-9.3'
            grep -F 'b70d3d222458512dbf67424a33fe463ae79b2c61dc41915424f810cc66d4f8ea' \
              "$live_home/opt/receipts/grease-netbsd-9.3-amd64.tsv"
