name: stage-zero-smoke

on:
  pull_request:

jobs:
  stage-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check POSIX stage zero
        shell: sh
        run: |
          for script in \
            catfood bootstrap.sh check-manifest.sh update-tools.ysh ci/repositories.sh \
            provision.sh install-binaries.sh activate.sh build-tools.sh refresh.sh doctor.sh import-config.sh \
            android/check.sh android/install.sh android/install-local-clients.sh \
            tests/check-manifest.sh tests/repository-identities.sh tests/entrypoint.sh tests/targets.sh tests/android-delivery.sh \
            tests/android-local-clients.sh tests/runtime-binaries.sh
          do
            if [ -f "$script" ]; then
              dash -n "$script"
              sh -n "$script"
            fi
          done
      - name: Verify the workbench manifest
        if: ${{ hashFiles('check-manifest.sh', 'tools.tsv') != '' }}
        shell: sh
        run: |
          sh tests/check-manifest.sh
          sh ./check-manifest.sh --remote
      - name: Exercise cloud and generic Termux entrypoints
        shell: sh
        run: sh tests/entrypoint.sh
      - name: Verify transferred repository identity and updates
        shell: sh
        run: sh tests/repository-identities.sh
      - name: Verify named target profiles
        shell: sh
        run: sh tests/targets.sh
      - name: Verify whole-inventory Android delivery contracts
        shell: sh
        run: sh tests/android-delivery.sh
      - name: Verify pinned runtime binary contracts
        shell: sh
        run: sh tests/runtime-binaries.sh
      - name: Verify Android local client feed
        shell: sh
        run: sh tests/android-local-clients.sh
  fresh-ubuntu-workbench:
    runs-on: ubuntu-latest
    env:
      CATFOOD_DEPTH: 1
      CATFOOD_NO_PROFILE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Provision workbench
        if: ${{ hashFiles('provision.sh') != '' }}
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
          CATFOOD_PREFIX: ${{ runner.temp }}/prefix
          CATFOOD_CACHE: ${{ runner.temp }}/cache
        shell: sh
        run: |
          sudo env \
            CATFOOD_ROOT="$CATFOOD_ROOT" \
            CATFOOD_PREFIX="$CATFOOD_PREFIX" \
            CATFOOD_CACHE="$CATFOOD_CACHE" \
            CATFOOD_DEPTH="$CATFOOD_DEPTH" \
            CATFOOD_NO_PROFILE="$CATFOOD_NO_PROFILE" \
            ./catfood

          foreign_owner=$(find "$CATFOOD_ROOT" "$CATFOOD_PREFIX" "$CATFOOD_CACHE" \
            ! -user root -print -quit)
          test -z "$foreign_owner"
      - name: Exercise transferred checkouts with the provisioned stage-one shell
        shell: sh
        env:
          CATFOOD_TEST_STAGE_ONE: ${{ runner.temp }}/prefix/bin/ysh
        run: sh tests/repository-identities.sh
      - name: Exercise keyless az through the installed Grease command path
        shell: ${{ runner.temp }}/cat-food/bin/grease {0}
        run: |
          set -eu
          runner_temp=$[ENV.RUNNER_TEMP]
          inherited_path=$[ENV.PATH]
          workspace="$runner_temp/cat-food"
          test -x "$workspace/bin/az"
          test -x "$workspace/bin/abe"
          fake_bin="$runner_temp/catfood-az-fixtures"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/curl" <<'EOF'
          #!/bin/sh
          for arg in "$@"; do
            if [ "$arg" = 'https://www.amazon.com/s?k=small%20useful%20book' ]; then
              printf '%s\n' '<div data-asin="B098765432"></div><div data-asin="B098765432"></div>'
              exit 0
            fi
          done
          printf 'unexpected az transport: %s\n' "$*" >&2
          exit 22
          EOF
          cat > "$fake_bin/bash" <<'EOF'
          #!/bin/sh
          echo 'az must use Grease, not a Bash fallback' >&2
          exit 97
          EOF
          chmod +x "$fake_bin/curl" "$fake_bin/bash"
          export PATH="$fake_bin:$workspace/bin:$inherited_path"
          export AZ_SECRET_FILE="$fake_bin/no-secret"
          export AZ_AMAZON_CREDENTIAL_ID=
          export AZ_AMAZON_CREDENTIAL_SECRET=
          export AZ_AMAZON_CREDENTIAL_VERSION=
          abe help >/dev/null
          output=$(az search small useful book)
          expected=$(printf 'asin\tamount\tcurrency\tbuy_url\ttitle\nB098765432\t\t\thttps://www.amazon.com/dp/B098765432?tag=macguyver03-20\t\n')
          test "$output" = "$expected"
      - name: Verify commands
        if: ${{ hashFiles('provision.sh') != '' }}
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
          CATFOOD_PREFIX: ${{ runner.temp }}/prefix
          CATFOOD_CACHE: ${{ runner.temp }}/cache
        shell: sh
        run: |
          PATH="$CATFOOD_PREFIX/bin:$CATFOOD_ROOT/bin:$PATH"
          export PATH
          sudo env \
            HOME=/root \
            PATH="$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            CATFOOD_ROOT="$CATFOOD_ROOT" \
            CATFOOD_PREFIX="$CATFOOD_PREFIX" \
            CATFOOD_CACHE="$CATFOOD_CACHE" \
            sh -c '
              "$CATFOOD_ROOT/bin/ysh" -c "echo"
              "$CATFOOD_ROOT/bin/osh" -c "echo"
              "$CATFOOD_ROOT/bin/jq" --version | grep -F "1.8.2"
              "$CATFOOD_ROOT/bin/mlr" --version | grep -F "6.21.0"
              "$CATFOOD_ROOT/bin/ysh" -n "$GITHUB_WORKSPACE/fdroid-deploy.ysh" >/dev/null
              "$CATFOOD_ROOT/bin/ysh" -n "$GITHUB_WORKSPACE/fdroid-check-deployed.ysh" >/dev/null
              "$CATFOOD_ROOT/bin/fdroid-deploy" --help >/dev/null
              "$CATFOOD_ROOT/bin/fdroid-check-deployed" --help >/dev/null
              output=$(GITLAB_TOKEN=catfood-test-token \
                "$CATFOOD_ROOT/bin/fdroid-deploy" /definitely/missing.yml 2>&1 || :)
              printf "%s\n" "$output" | grep -F "metadata file not found"
              "$CATFOOD_ROOT/bin/az" link B000000000 >/dev/null
              "$CATFOOD_ROOT/bin/abe" link "https://www.abebooks.com/servlet/BookDetailsPL?bi=1" >/dev/null
              "$CATFOOD_ROOT/bin/catfood-doctor"
            '
