name: stage-zero-smoke

on:
  pull_request:

jobs:
  stage-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX stage zero
        shell: sh
        run: |
          if [ -f bootstrap.sh ] && [ -f update-tools.ysh ]; then
            dash -n bootstrap.sh
            dash -n update-tools.ysh
            sh -n bootstrap.sh
            sh -n update-tools.ysh
          else
            echo 'bootstrap files are not present on this branch; nothing to check yet'
          fi
      - name: Exercise az through the stable command path
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/catfood-az"
          manifest="$RUNNER_TEMP/catfood-az.tsv"
          printf '%s\n' 'az https://github.com/isomorphisms/az.git main none' > "$manifest"

          CATFOOD_ROOT="$workspace" CATFOOD_DEPTH=1 CATFOOD_MANIFEST="$manifest" \
            sh ./update-tools.ysh

          test -x "$workspace/bin/az"
          test -x "$workspace/bin/abe"
          export PATH="$workspace/bin:$PATH"
          abe help >/dev/null

          fake_bin="$RUNNER_TEMP/catfood-fake-bin"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/curl" <<'EOF'
          #!/bin/sh
          for arg in "$@"; do
            case "$arg" in
              https://mock/token)
                printf '%s\n' '{"access_token":"test-token","expires_in":3600}'
                exit 0
                ;;
              https://mock/catalog/v1/searchItems)
                cat <<'JSON'
          {"searchResult":{"items":[{"asin":"B098765432","detailPageURL":"https://www.amazon.com/dp/B098765432?tag=macguyver03-20&linkCode=osi","itemInfo":{"title":{"displayValue":"A Small Useful Book"}},"offersV2":{"listings":[{"isBuyBoxWinner":true,"price":{"money":{"amount":12.34,"currency":"USD"}}}]}}]}}
          JSON
                exit 0
                ;;
            esac
          done
          printf 'fake curl: unexpected arguments: %s\n' "$*" >&2
          exit 22
          EOF
          chmod +x "$fake_bin/curl"

          export PATH="$fake_bin:$PATH"
          export AZ_AMAZON_CREDENTIAL_ID=test-id
          export AZ_AMAZON_CREDENTIAL_SECRET=test-secret
          export AZ_AMAZON_CREDENTIAL_VERSION=3.1
          export AZ_AMAZON_TOKEN_ENDPOINT=https://mock/token
          export AZ_CREATORS_API_BASE=https://mock

          output=$(az search small useful book)
          printf '%s\n' "$output"
          grep -F $'B098765432\t12.34\tUSD' <<<"$output"
          grep -F 'A Small Useful Book' <<<"$output"

  fresh-ubuntu-workbench:
    runs-on: ubuntu-latest
    env:
      CATFOOD_DEPTH: 1
      CATFOOD_NO_PROFILE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Provision workbench
        if: ${{ hashFiles('provision.sh') != '' }}
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
          CATFOOD_PREFIX: ${{ runner.temp }}/prefix
          CATFOOD_CACHE: ${{ runner.temp }}/cache
        shell: sh
        run: sh ./provision.sh
      - name: Verify commands
        if: ${{ hashFiles('provision.sh') != '' }}
        env:
          CATFOOD_ROOT: ${{ runner.temp }}/cat-food
          CATFOOD_PREFIX: ${{ runner.temp }}/prefix
          CATFOOD_CACHE: ${{ runner.temp }}/cache
        shell: sh
        run: |
          PATH="$CATFOOD_PREFIX/bin:$CATFOOD_ROOT/bin:$PATH"
          export PATH
          "$CATFOOD_ROOT/bin/ysh" -c 'echo'
          "$CATFOOD_ROOT/bin/osh" -c 'echo'
          "$CATFOOD_ROOT/bin/az" link B000000000 >/dev/null
          "$CATFOOD_ROOT/bin/abe" link 'https://www.abebooks.com/servlet/BookDetailsPL?bi=1' >/dev/null
          "$CATFOOD_ROOT/bin/catfood-doctor"
